[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "endframe"
dynamic = ["version"]
description = "Simple video trimmer that also saves the last frame of the cut as PNG (PyQt6 + ffmpeg)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Felipe Dutra" }]
keywords = ["video", "trim", "cut", "ffmpeg", "frame", "pyqt6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Video",
]
# ffmpeg e ffprobe são programas externos: precisam estar no PATH (ver README)
dependencies = ["PyQt6>=6.5"]

[project.urls]
Repository = "https://github.com/FRubik/endframe"

[project.gui-scripts]
endframe = "endframe:main"

[tool.hatch.version]
path = "endframe.py"

# programa de arquivo único: o wheel leva o módulo e o ícone ao lado dele
[tool.hatch.build.targets.wheel]
only-include = ["endframe.py"]

[tool.hatch.build.targets.wheel.force-include]
"assets/icone.svg" = "endframe_icone.svg"

[tool.hatch.build.targets.sdist]
# padrões ancorados na raiz ("/..."): sem a barra, "README*.md" casaria em qualquer subpasta
include = ["/endframe.py", "/assets/", "/tests/", "/scripts/", "/instalar-atalho.sh", "/README.md", "/README.pt-BR.md", "/LICENSE"]

# Ruff: lint + formatação. Rodar com `uvx ruff check . && uvx ruff format --check .`
# (os testes também rodam, em tests/test_projeto.py)
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# E/W estilo, F erros reais (nome indefinido, import sobrando), I ordem dos imports,
# B armadilhas comuns, UP sintaxe moderna, SIM simplificações
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
